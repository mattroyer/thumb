name: ci

on:
  push:
    branches: [main]
  pull_request:

# Tests only need to read the code. This keeps the workflow's token read-only,
# even for pull requests.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false # let each OS report its own result
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod's "go 1.22" is the minimum to build thumb. CI and releases use
          # current stable Go: macOS refuses to run binaries from older Go
          # versions ("missing LC_UUID load command").
          go-version: stable
      - run: go vet ./...
      - run: go test -count=1 ./...
